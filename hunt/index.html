<!doctype html>
<html lang="en" class="tv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0c0306">
  <title>Treasure Hunt</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css?v=20261013d">
  <link rel="stylesheet" href="../css/darts.css?v=20261013d">
</head>
<body class="tv">
  <canvas class="tv-canvas" id="fireCanvas" aria-hidden="true"></canvas>
  <div class="tv-stage hunt-stage">
    <header class="tv-head">
      <div>
        <h1 class="display"><span aria-hidden="true">🗺️</span> <span class="gold-text">TREASURE HUNT</span></h1>
        <p class="sub">DUSSEHRA 2026 · LEADERBOARD</p>
      </div>
      <div class="tv-status"><span class="live" id="liveDot"></span><span id="liveText">Live</span></div>
    </header>
    <main class="tv-main">
      <section class="board hunt-board" id="board" aria-label="Team standings" aria-live="polite"></section>
    </main>
    <footer class="rules" aria-label="Scoring rules">
      <span><b>Clue 1</b> +5</span><span><b>Clue 2</b> +10</span><span><b>Clue 3</b> +15</span><span><b>Final</b> +20</span>
      <span>⚡ All clues <b>within 5 min</b> <span class="pos">+20</span> · <b>within 10 min</b> <span class="pos">+10</span></span>
      <span>Tie → faster team wins</span>
    </footer>
  </div>
  <div class="tv-empty" id="tvEmpty" hidden>
    <h2 class="display"><span class="gold-text">TREASURE HUNT</span></h2>
    <p>Waiting for the scorer to create the hunt…</p>
  </div>
  <div class="winner" id="winner" hidden aria-live="polite">
    <p class="trophy" aria-hidden="true">🏆</p>
    <p class="wins" id="winLabel">WINNER</p>
    <h2 class="display"><span class="gold-text" id="winName"></span></h2>
    <div class="final" id="finalBoard"></div>
  </div>

  <script src="../js/config.js?v=20261013d"></script>
  <script src="../js/local-backend.js?v=20261013d"></script>
  <script src="../js/api.js?v=20261013d"></script>
  <script src="../js/fire.js?v=20261013d"></script>
  <script src="../js/hunt.js?v=20261013d"></script>
  <script src="../js/hunt-board.js?v=20261013d"></script>
</body>
</html>
